<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokedex</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="stylesheet" href="backgroundColors.css" />

		<script src="script.js" defer></script>
		<script defer src="TemplateFunctions.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/x-icon" href="media/favico.ico" />
	</head>
	<body>
		<header>
			<img alt="fotogram-logo" src="media/fotogram.png" class="header-logo" />
			<h1 id="logo">Pokedex</h1>
			<input type="text" id="search-field" oninput="searchFieldTrigger()" />
		</header>
		<main>
			<section id="poke-container"></section>
			<button class="fetch-more-button" onclick="fetchMore()">Fetch more</button>
			<dialog closedby="any" id="pokemon-highlight"></dialog>
		</main>
		<footer>
			<img src="media/DA_watermark.png" alt="developer akademie logo" class="DA-logo" />
			<p class="footer-p">© 2026 Dataletra</p>
		</footer>
	</body>
</html>
